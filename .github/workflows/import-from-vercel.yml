name: Import source from Vercel

on:
  push:
    paths:
      - .github/workflows/import-from-vercel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the live project source
        run: |
          curl -fsSL https://dotnet-mastery.vercel.app/dotnet-mastery-react.zip -o /tmp/src.zip
          mkdir -p /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          rm -f /tmp/src/dotnet-mastery/public/sql-wasm.wasm /tmp/src/dotnet-mastery/SOURCE-NOTES.txt
          rsync -a --exclude .git /tmp/src/dotnet-mastery/ ./
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "vite",
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "cleanUrls": true
          }
          JSON
          sed -i 's/^          //' vercel.json
          git rm -q --cached .github/workflows/import-from-vercel.yml
          rm .github/workflows/import-from-vercel.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import .NET Mastery source with ASP.NET Core backend track

          Adds 18 Backend Engineering lessons (Web API, EF Core, JWT,
          role/policy authorization, MVC cookie auth, CSRF, error handling,
          refresh tokens) and makes lesson counts module-aware."
          git push
